spring.application.name=barbersoft

# Configuracion de PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/barbersoft}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# HU08 - CONFIGURACIÓN DE SEGURIDAD
# ==========================================

# Secreto Base64 para firmar los JWT.
security.jwt.secret=${JWT_SECRET}

# Duración del token: 30 minutos.
security.jwt.expiration-ms=1800000

# Datos del administrador inicial.
app.admin.name=${ADMIN_NAME}
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

logging.level.org.springframework.security=TRACE